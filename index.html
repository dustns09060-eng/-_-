<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>여우방 맞팔확인</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="icon-192.png" alt="여우방">
    <strong>여우방</strong>
  </div>
  <button id="installButton" class="install-btn hidden">앱설치</button>
</header>

<div id="noticeBar" class="notice hidden">
  <strong>공지</strong>
  <span id="noticeText"></span>
  <button id="noticeClose">×</button>
</div>

<main>
  <section id="checkView" class="page">
    <div id="checkLockPanel" class="card lock-card hidden">
      <div class="lock-icon">🔒</div>
      <h2>맞팔확인 잠금 중</h2>
      <p>운영진이 현재 맞팔확인 기능을 잠가두었습니다.</p>
    </div>

    <div id="checkContent">
      <section class="card summary-card">
        <div class="section-title">
          <h1>분석 결과 요약</h1>
          <button id="resetAnalysis" class="round-refresh" aria-label="다시 분석">↻</button>
        </div>

        <div class="metric-grid">
          <div class="metric">
            <span>맞팔 완료</span>
            <b class="green" id="mutualCount">0명</b>
            <small id="mutualPct">0%</small>
          </div>
          <div class="metric">
            <span>나만 팔로우 함</span>
            <b class="orange" id="onlyMeCount">0명</b>
            <small id="onlyMePct">0%</small>
          </div>
          <div class="metric">
            <span>상대가 팔로우만 함</span>
            <b class="blue" id="onlyThemCount">0명</b>
            <small id="onlyThemPct">0%</small>
          </div>
          <div class="metric">
            <span>서로 팔로우 안 함</span>
            <b class="gray" id="neitherCount">0명</b>
            <small id="neitherPct">0%</small>
          </div>
        </div>

        <div class="rate-line">
          단톡방 맞팔률 <strong id="mutualRate">0%</strong>
          <span>·</span>
          <b id="rateFraction">0/0명</b>
        </div>
      </section>

      <section class="card upload-search-card">
        <div class="upload-box">
          <label for="instagramZip">인스타그램 ZIP 파일 선택</label>
          <input id="instagramZip" type="file" accept=".zip,application/zip">
          <button id="analyzeButton" class="main-button">맞팔 분석 시작</button>
          <p id="analyzeStatus">구글시트 명단을 불러오는 중입니다.</p>
        </div>

        <div class="search-box">
          <span>⌕</span>
          <input id="checkSearch" placeholder="아이디 또는 닉네임 검색">
        </div>

        <div class="action-row">
          <button id="copyMismatch" class="outline-btn">미맞팔 복사</button>
        </div>

        <div id="filterButtons" class="filter-row">
          <button class="active" data-filter="all">전체 (0)</button>
          <button data-filter="mutual">맞팔 (0)</button>
          <button data-filter="onlyMe">나만 팔로우 (0)</button>
          <button data-filter="onlyThem">상대만 팔로우 (0)</button>
          <button data-filter="neither">서로 안 함 (0)</button>
        </div>

        <div id="checkList" class="result-list"></div>
      </section>
    </div>
  </section>

  <section id="adminView" class="page hidden">
    <section id="adminLoginBox" class="card admin-login">
      <h1>운영진 로그인</h1>
      <p>운영진 비밀번호를 입력해 주세요.</p>
      <div class="password-row">
        <input id="adminPassword" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
        <button id="passwordToggle" class="outline-btn">보기</button>
      </div>
      <button id="adminLoginButton" class="main-button">로그인</button>
    </section>

    <section id="adminPanel" class="card hidden">
      <div class="section-title">
        <h1>운영진</h1>
        <button id="adminLogoutButton" class="outline-btn">로그아웃</button>
      </div>

      <div class="admin-grid">
        <a href="https://docs.google.com/spreadsheets/d/1QfguFyvtgNUyfd4-ufMxAWRwItHuIY6M4wGAQstteW0/edit" target="_blank" rel="noopener">📄<span>구글시트 열기</span></a>
        <button id="adminReloadButton">↻<span>명단 새로고침</span></button>
        <button id="toggleLockButton">🔒<span id="lockButtonText">맞팔 잠금 변경</span></button>
      </div>

      <div class="admin-block">
        <h2>공지 작성</h2>
        <textarea id="noticeInput" rows="5" placeholder="공지 내용을 입력하세요"></textarea>
        <div class="two-buttons">
          <button id="saveNoticeButton" class="main-button">공지 저장</button>
          <button id="deleteNoticeButton" class="outline-btn">공지 삭제</button>
        </div>
      </div>
    </section>
  </section>
</main>

<footer class="bottom-nav">
  <button class="active" data-view="check">↔<span>맞팔확인</span></button>
  <button data-view="admin">⚙<span>운영진</span></button>
</footer>
</body>
</html>
